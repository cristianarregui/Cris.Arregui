    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #ffffff;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #f1d675;
      --black: #080808;
      --dark: #111111;
      --gray: #1d1d1d;
      --white: #ffffff;
      --green: #00a878;
      --green-light: #38d9a9;
    }

    /* WHATSAPP FLOTANTE */

    .whatsapp-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 60px;
      height: 60px;
      background: #25D366;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      z-index: 999;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    /* NAVEGACIÓN */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,8,8,0.96);
      border-bottom: 1px solid rgba(212,175,55,0.25);
      padding: 14px 5%;
    }

    .nav-content {
      max-width: 1150px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-weight: bold;
      font-size: 18px;
      color: var(--gold);
    }

    .nav-button {
      color: white;
      border: 1px solid var(--gold);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
    }

    /* HERO */

    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;
      background:
        radial-gradient(circle at top, rgba(212,175,55,0.18), transparent 40%),
        linear-gradient(135deg, #050505, #151515);
    }

    .hero-content {
      max-width: 900px;
    }

    .hero small {
      color: var(--gold);
      font-weight: bold;
      letter-spacing: 3px;
    }

    .hero h1 {
      font-size: clamp(42px, 9vw, 90px);
      line-height: 0.95;
      margin: 18px 0;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero h2 {
      font-size: clamp(18px, 4vw, 28px);
      font-weight: normal;
      color: #dddddd;
      margin-bottom: 25px;
    }

    .hero p {
      max-width: 700px;
      margin: auto;
      color: #bbbbbb;
      font-size: 18px;
    }

    .hero-buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    /* BOTONES */

    .btn {
      display: inline-block;
      padding: 15px 25px;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
      border: 2px solid transparent;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-gold {
      background: var(--gold);
      color: black;
    }

    .btn-outline {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* SECCIONES */

    section {
      padding: 85px 6%;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    .section-label {
      color: var(--gold);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(32px, 6vw, 55px);
      margin-bottom: 25px;
      line-height: 1.1;
    }

    .section-title span {
      color: var(--gold);
    }

    .text {
      color: #c5c5c5;
      font-size: 17px;
      margin-bottom: 18px;
    }

    /* QUIÉN SOY */

    .about {
      background: #101010;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .about-box {
      border: 1px solid rgba(212,175,55,0.25);
      background: linear-gradient(145deg, #161616, #0b0b0b);
      padding: 35px;
      border-radius: 18px;
    }

    .highlight {
      color: var(--gold-light);
      font-weight: bold;
    }

    /* RECORRIDO */

    .journey {
      background: #080808;
    }

      display: grid;
      gap: 18px;
      margin-top: 35px;
    }
